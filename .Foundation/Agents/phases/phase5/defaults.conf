# ─────────────────────────────────────────────────────────────────────────────
# Foundation BuildAgent Defaults Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# This file contains default settings for BuildAgent and BuildLint.
# Settings can be overridden by:
#   1. Environment variables (highest priority)
#   2. Command-line flags
#   3. This configuration file (lowest priority)
#
# To enable a setting, uncomment it and set the desired value.
# Boolean values: true, false (lowercase)
#
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════
# Terminal UI Settings
# ═══════════════════════════════════════════════════════════════════════════

# Enable fancy terminal UI with colors, icons, and visual components
# When false, uses plain text output suitable for CI/CD and logs
# Default: true (automatically disabled in CI/CD environments)
BUILDAGENT_FANCY_UI=true

# Color theme: dark, light
# Dark theme uses vibrant colors on dark backgrounds (Catppuccin-inspired)
# Light theme uses adjusted colors for light backgrounds
# Default: dark
BUILDAGENT_THEME=dark

# Spinner animation style
# Options: braille, dots, arrows, bounce, pulse, moon, clock, box, star
# Default: braille
BUILDAGENT_SPINNER_STYLE=braille

# Show witty phrases during spinner animation
# Phrases rotate every 5 seconds during long operations
# Default: true
BUILDAGENT_WITTY_PHRASES=true

# Show random helpful tips after banner display
# Default: true
BUILDAGENT_SHOW_TIPS=true

# ═══════════════════════════════════════════════════════════════════════════
# Build Settings
# ═══════════════════════════════════════════════════════════════════════════

# Enable incremental builds using generated Makefiles
# Provides 2-10x faster builds for small changes
# Default: true
INCREMENTAL_BUILDS_ENABLED=true

# Default build configuration
# Options: Debug, Release
# Default: Debug
BUILD_CONFIGURATION=Debug

# Skip Swift macro validation during build
# Speeds up builds when using macros from trusted packages
# Default: true
SKIP_MACRO_VALIDATION=true

# ═══════════════════════════════════════════════════════════════════════════
# Session Management
# ═══════════════════════════════════════════════════════════════════════════

# Enable session defaults (remembers your preferences)
# Stores defaults in .foundation-session.json
# Default: true
SESSION_DEFAULTS_ENABLED=true

# Number of uses before offering to persist a flag as default
# After using the same flag value N times, prompts to save as default
# Default: 3
SESSION_LEARNING_THRESHOLD=3

# Time window for learning in days
# Only counts flag uses within this window
# Default: 7
SESSION_LEARNING_WINDOW_DAYS=7

# Automatic cleanup of old log files (days to retain)
# Cleans Artifacts/build_* directories older than this
# Default: 3
SESSION_LOG_RETENTION_DAYS=3

# ═══════════════════════════════════════════════════════════════════════════
# Multi-Platform Build Settings
# ═══════════════════════════════════════════════════════════════════════════

# Automatically detect and build for all supported platforms
# When true, scans project.pbxproj for SUPPORTED_PLATFORMS
# Default: true
AUTO_MULTI_PLATFORM=true

# Stop on first platform failure
# When false, continues building all platforms even if some fail
# Default: false
MULTI_PLATFORM_FAIL_FAST=false

# Maximum parallel platform builds
# Set to 1 for sequential builds, higher for parallel
# Default: 0 (use number of detected platforms)
MULTI_PLATFORM_PARALLELISM=0

# ═══════════════════════════════════════════════════════════════════════════
# Verbosity Settings
# ═══════════════════════════════════════════════════════════════════════════

# Log level: error, warning, info, debug
# error   - Only show errors
# warning - Show errors and warnings
# info    - Show errors, warnings, and info (default)
# debug   - Show everything including verbose output
# Default: info
LOG_LEVEL=info

# ═══════════════════════════════════════════════════════════════════════════
# AI Provider Settings
# ═══════════════════════════════════════════════════════════════════════════

# Default AI provider
# Options: cursor, claude, codex, gemini, aider, letta, copilot
# Default: copilot
AI_PROVIDER=copilot

# Maximum repair attempts before giving up
# Higher values give more chances for AI to fix issues
# Default: 3
MAX_REPAIR_ATTEMPTS=3

# Enable smart documentation filtering
# Uses AI or keyword matching to select relevant docs
# Default: true
SMART_DOCS=true

# ═══════════════════════════════════════════════════════════════════════════
# Build Queue Coordination
# ═══════════════════════════════════════════════════════════════════════════

# Enable build queue for coordinating multiple agent instances
# Prevents conflicts when multiple agents modify code simultaneously
# Default: true
BUILD_QUEUE_ENABLED=true

# ═══════════════════════════════════════════════════════════════════════════
# Linting Settings
# ═══════════════════════════════════════════════════════════════════════════

# Skip SwiftLint by default
# Set to true if SwiftLint causes issues or is not needed
# Default: false
SKIP_LINT=false
