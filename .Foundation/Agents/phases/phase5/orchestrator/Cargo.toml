[package]
name = "orch"
version = "0.1.0"
edition = "2021"
authors = ["Foundation Team"]
description = "Rust TUI orchestrator for Foundation build pipeline"

[[bin]]
name = "orch"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.9"
vte = "0.15"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
