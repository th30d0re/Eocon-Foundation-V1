[package]
name = "foundation-repair-classifier"
version = "0.1.0"
edition = "2021"
description = "Classify Swift build errors and select a repair strategy using UCB1 exploration"

[[bin]]
name = "foundation-repair-classifier"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
strip = true
