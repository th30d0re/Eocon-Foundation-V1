name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Foundation macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install bats-core shellcheck swiftlint jq || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Set executable permissions on agent scripts
        run: |
          find .Foundation/Agents .Foundation/lib -type f -name '*.sh' -exec chmod +x {} + || true

      - name: Run shellcheck on agent scripts
        run: |
          find .Foundation/Agents .Foundation/lib -type f -name '*.sh' -print0 |
            xargs -0 shellcheck -S warning -e SC1090,SC1091,SC2154,SC2034 || true

      - name: Run BATS tests
        run: |
          BATS_BIN=".Foundation/Agents/phases/phase5/tests/bats/lib/bats-core/bin/bats"
          if [[ -x "$BATS_BIN" ]]; then
            "$BATS_BIN" .Foundation/Agents/phases/phase5/tests/bats
          else
            echo "BATS submodule not available; falling back to brew bats"
            bats .Foundation/Agents/phases/phase5/tests/bats
          fi

      - name: Run Rust orchestrator tests
        working-directory: .Foundation/Agents/phases/phase5/orchestrator
        run: cargo test --verbose

      - name: Build Rust orchestrator (release)
        working-directory: .Foundation/Agents/phases/phase5/orchestrator
        run: cargo build --release --verbose

      - name: Build Swift app (best-effort)
        continue-on-error: true
        run: |
          if [[ -d "Foundation/Foundation.xcodeproj" ]]; then
            xcodebuild \
              -project Foundation/Foundation.xcodeproj \
              -scheme Foundation \
              -sdk macosx \
              -destination 'platform=macOS' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build | tee /tmp/foundation_build.log
          else
            echo "Foundation.xcodeproj not present; skipping Swift build"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-logs-${{ github.run_id }}
          path: |
            /tmp/foundation_build.log
            .Foundation/Agents/phases/phase5/orchestrator/target/release/build/**
            .Foundation/Agents/phases/phase5/orchestrator/target/release/orch
          if-no-files-found: ignore
